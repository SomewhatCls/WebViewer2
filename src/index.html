<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluent Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="strip">
    <div id="tabs" role="tablist"></div>
    <button id="new" class="icon" title="New tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div id="spacer"></div>
    <div id="controls">
      <button id="win-min" class="cap" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button id="win-max" class="cap" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 10 10"><path d="M.5.5h9v9h-9z"/></svg></button>
      <button id="win-close" class="cap close-win" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>
  <div id="bar">
    <button id="back" class="icon" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
    </button>
    <button id="fwd" class="icon" title="Forward" aria-label="Forward">
      <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </button>
    <button id="reload" class="icon" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
    <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address">
    <button id="add" class="primary" hidden>Add to browser</button>
    <button id="ext" class="icon" title="Extensions" aria-label="Extensions">
      <svg viewBox="0 0 24 24"><path d="M5 5h4a2 2 0 1 1 4 0h6v5a2 2 0 1 1 0 4v5H5v-5a2 2 0 1 1 0-4V5z"/></svg>
    </button>
  </div>
  <div id="progress"></div>
  <script src="app.js"></script>
</body>
</html>
